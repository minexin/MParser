name: Cross-platform CI

on:
  push:
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "**/*.md"
      - LICENSE
      - NOTICE
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "**/*.md"
      - LICENSE
      - NOTICE
  workflow_dispatch:
    inputs:
      collect_performance_evidence:
        description: Collect and upload native performance reports
        required: true
        type: boolean
        default: false
      collect_release_artifacts:
        description: Build and upload all release archives
        required: true
        type: boolean
        default: false
      validate_cross_compile:
        description: Run the optional Linux AArch64 cross/QEMU release smoke
        required: true
        type: boolean
        default: false
      authenticate_release:
        description: >-
          Publish release identity and digests to Sigstore's public
          transparency log; select the exact release tag before enabling
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  SCCACHE_GHA_ENABLED: "true"
  MPARSER_CI_PERFORMANCE_EVIDENCE: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.collect_performance_evidence || inputs.authenticate_release)) }}
  MPARSER_CI_RELEASE_ARTIFACTS: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.collect_release_artifacts || inputs.authenticate_release)) }}

concurrency:
  group: mparser-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Windows x64 / MSVC / SLJIT
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Configure
        run: >-
          cmake -S . -B build-ci -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DMPARSER_ENABLE_NATIVE_JIT=ON
          -DMPARSER_ENABLE_RELEASE_PACKAGING=ON
          -DMPARSER_WARNINGS_AS_ERRORS=ON
          -DMPARSER_PERFORMANCE_EVIDENCE_REVISION=${{ github.sha }}
      - name: Build
        run: cmake --build build-ci --parallel 4
      - name: Test
        run: ctest --test-dir build-ci --output-on-failure
      - name: Collect native performance evidence
        if: env.MPARSER_CI_PERFORMANCE_EVIDENCE == 'true'
        run: >-
          cmake --build build-ci
          --target mparser_performance_evidence
          --parallel 4
      - name: Build release archive and checksums
        if: env.MPARSER_CI_RELEASE_ARTIFACTS == 'true'
        run: >-
          cmake --build build-ci
          --target mparser_release_package
          --parallel 4
      - name: Upload Windows release archive
        if: env.MPARSER_CI_RELEASE_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mparser-1.2.0-windows-x86_64
          path: |
            build-ci/packages/mparser-1.2.0-windows-x86_64.zip
            build-ci/packages/mparser-1.2.0-windows-x86_64.zip.sha256
            build-ci/packages/mparser-1.2.0-windows-x86_64.zip.provenance.json
            build-ci/packages/SHA256SUMS
          if-no-files-found: error
      - name: Upload Windows performance evidence
        if: env.MPARSER_CI_PERFORMANCE_EVIDENCE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mparser-performance-1.2.0-windows-x86_64
          path: build-ci/performance-evidence/*.json
          if-no-files-found: error
          retention-days: 90

  linux-x64:
    name: Linux x64 / GCC / SLJIT
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Configure
        run: >-
          cmake -S . -B build-ci -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DMPARSER_ENABLE_NATIVE_JIT=ON
          -DMPARSER_ENABLE_RELEASE_PACKAGING=ON
          -DMPARSER_WARNINGS_AS_ERRORS=ON
          -DMPARSER_PERFORMANCE_EVIDENCE_REVISION=${{ github.sha }}
      - name: Build
        run: cmake --build build-ci --parallel 4
      - name: Test
        run: ctest --test-dir build-ci --output-on-failure
      - name: Collect native performance evidence
        if: env.MPARSER_CI_PERFORMANCE_EVIDENCE == 'true'
        run: >-
          cmake --build build-ci
          --target mparser_performance_evidence
          --parallel 4
      - name: Build release archive and checksums
        if: env.MPARSER_CI_RELEASE_ARTIFACTS == 'true'
        run: >-
          cmake --build build-ci
          --target mparser_release_package
          --parallel 4
      - name: Upload Linux x64 release archive
        if: env.MPARSER_CI_RELEASE_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mparser-1.2.0-linux-x86_64
          path: |
            build-ci/packages/mparser-1.2.0-linux-x86_64.tar.gz
            build-ci/packages/mparser-1.2.0-linux-x86_64.tar.gz.sha256
            build-ci/packages/mparser-1.2.0-linux-x86_64.tar.gz.provenance.json
            build-ci/packages/SHA256SUMS
          if-no-files-found: error
      - name: Upload Linux x64 performance evidence
        if: env.MPARSER_CI_PERFORMANCE_EVIDENCE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mparser-performance-1.2.0-linux-x86_64
          path: build-ci/performance-evidence/*.json
          if-no-files-found: error
          retention-days: 90

  linux-arm64-native:
    name: Linux ARM64 / GCC / SLJIT native
    runs-on: ubuntu-24.04-arm
    # Public repositories currently receive a larger standard runner than
    # private repositories. Keep enough headroom for the same lane after the
    # repository returns to private visibility.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Validate host architecture
        run: test "$(uname -m)" = "aarch64"
      - name: Configure
        run: >-
          cmake -S . -B build-ci -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DMPARSER_ENABLE_NATIVE_JIT=ON
          -DMPARSER_ENABLE_RELEASE_PACKAGING=ON
          -DMPARSER_WARNINGS_AS_ERRORS=ON
          -DMPARSER_PERFORMANCE_EVIDENCE_REVISION=${{ github.sha }}
      - name: Build
        run: cmake --build build-ci --parallel 4
      - name: Test
        run: ctest --test-dir build-ci --output-on-failure --timeout 240
      - name: Collect native performance evidence
        if: env.MPARSER_CI_PERFORMANCE_EVIDENCE == 'true'
        run: >-
          cmake --build build-ci
          --target mparser_performance_evidence
          --parallel 4
      - name: Upload Linux ARM64 performance evidence
        if: env.MPARSER_CI_PERFORMANCE_EVIDENCE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mparser-performance-1.2.0-linux-aarch64
          path: build-ci/performance-evidence/*.json
          if-no-files-found: error
          retention-days: 90

  linux-sanitizers:
    name: Linux x64 / Clang / ASan + UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1:check_initialization_order=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      CFLAGS: -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -fno-optimize-sibling-calls -fno-sanitize-recover=all
      # vptr requires the C++ UBSan runtime in every final executable, including
      # the intentionally pure-C ABI consumers. Keep the remaining UBSan set.
      CXXFLAGS: -O1 -g -fsanitize=address,undefined -fno-sanitize=vptr -fno-omit-frame-pointer -fno-optimize-sibling-calls -fno-sanitize-recover=all
    steps:
      - uses: actions/checkout@v6
      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Configure
        run: >-
          cmake -S . -B build-sanitizers -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DMPARSER_ENABLE_NATIVE_JIT=OFF
          -DMPARSER_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build-sanitizers --parallel 4
      - name: Test
        run: >-
          ctest --test-dir build-sanitizers --output-on-failure
          --parallel 2 --timeout 240

  macos:
    name: macOS ${{ matrix.arch }} / Apple Clang / SLJIT
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
            build_parallel: 4
          - runner: macos-15
            arch: arm64
            build_parallel: 3
    runs-on: ${{ matrix.runner }}
    # Keep release/package headroom even though the bounded Ninja build should
    # finish well below this limit on the 3-core standard ARM64 runner.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Validate host architecture
        run: test "$(uname -m)" = "${{ matrix.arch }}"
      - name: Configure
        run: >-
          cmake -S . -B build-ci -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DMPARSER_ENABLE_NATIVE_JIT=ON
          -DMPARSER_ENABLE_RELEASE_PACKAGING=ON
          -DMPARSER_WARNINGS_AS_ERRORS=ON
          -DMPARSER_PERFORMANCE_EVIDENCE_REVISION=${{ github.sha }}
      - name: Build
        run: cmake --build build-ci --parallel ${{ matrix.build_parallel }}
      - name: Test
        run: ctest --test-dir build-ci --output-on-failure
      - name: Collect native performance evidence
        if: env.MPARSER_CI_PERFORMANCE_EVIDENCE == 'true'
        run: >-
          cmake --build build-ci
          --target mparser_performance_evidence
          --parallel ${{ matrix.build_parallel }}
      - name: Build release archive and checksums
        if: env.MPARSER_CI_RELEASE_ARTIFACTS == 'true'
        run: >-
          cmake --build build-ci
          --target mparser_release_package
          --parallel ${{ matrix.build_parallel }}
      - name: Upload macOS release archive
        if: env.MPARSER_CI_RELEASE_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mparser-1.2.0-macos-${{ matrix.arch }}
          path: |
            build-ci/packages/mparser-1.2.0-macos-${{ matrix.arch }}.tar.gz
            build-ci/packages/mparser-1.2.0-macos-${{ matrix.arch }}.tar.gz.sha256
            build-ci/packages/mparser-1.2.0-macos-${{ matrix.arch }}.tar.gz.provenance.json
            build-ci/packages/SHA256SUMS
          if-no-files-found: error
      - name: Upload macOS performance evidence
        if: env.MPARSER_CI_PERFORMANCE_EVIDENCE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mparser-performance-1.2.0-macos-${{ matrix.arch }}
          path: build-ci/performance-evidence/*.json
          if-no-files-found: error
          retention-days: 90

  linux-aarch64:
    name: Linux AArch64 / GCC cross / QEMU release smoke
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.validate_cross_compile || inputs.collect_release_artifacts || inputs.authenticate_release))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install AArch64 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-aarch64-linux-gnu g++-aarch64-linux-gnu qemu-user
      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Configure native JIT build
        run: >-
          cmake -S . -B build-arm64-jit -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/linux-aarch64.cmake
          -DCMAKE_CROSSCOMPILING_EMULATOR="qemu-aarch64;-L;/usr/aarch64-linux-gnu"
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DBUILD_TESTING=OFF
          -DMPARSER_ENABLE_NATIVE_JIT=ON
          -DMPARSER_ENABLE_RELEASE_PACKAGING=ON
          -DMPARSER_WARNINGS_AS_ERRORS=ON
      - name: Build AArch64 release SDK
        run: >-
          cmake --build build-arm64-jit
          --target mparser_release_package
          --parallel 4
      - name: Validate native, portable, and disabled JIT modes under QEMU
        shell: bash
        run: |
          set -euo pipefail
          runtime="$PWD/build-arm64-jit/mparser"
          qemu-aarch64 -L /usr/aarch64-linux-gnu "$runtime" \
            --run --jit=native --native-cache-stats \
            samples/production_run_demo.m | tee build-arm64-jit/arm64-native-output.txt
          grep --fixed-strings "summary = 705" build-arm64-jit/arm64-native-output.txt
          grep --extended-regexp "compilations=[1-9][0-9]*" build-arm64-jit/arm64-native-output.txt
          qemu-aarch64 -L /usr/aarch64-linux-gnu "$runtime" \
            --run --jit=portable samples/production_run_demo.m \
            | tee build-arm64-jit/arm64-portable-output.txt
          grep --fixed-strings "summary = 705" build-arm64-jit/arm64-portable-output.txt
          qemu-aarch64 -L /usr/aarch64-linux-gnu "$runtime" \
            --run --jit=off --native-cache-stats samples/production_run_demo.m \
            | tee build-arm64-jit/arm64-jit-off-output.txt
          grep --fixed-strings "summary = 705" build-arm64-jit/arm64-jit-off-output.txt
          grep --fixed-strings "compilations=0" build-arm64-jit/arm64-jit-off-output.txt
      - name: Validate installed cross-built C and C++ SDKs under QEMU
        shell: bash
        run: |
          cmake --install build-arm64-jit --prefix "$PWD/build-arm64-jit/install-sdk"
          cmake -S tests/installed_c_consumer -B build-arm64-jit-consumer -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/toolchains/linux-aarch64.cmake" \
            -DCMAKE_CROSSCOMPILING_EMULATOR="qemu-aarch64;-L;/usr/aarch64-linux-gnu" \
            -DCMAKE_PREFIX_PATH="$PWD/build-arm64-jit/install-sdk" \
            -DMPARSER_REQUIRED_VERSION=1.2.0
          cmake --build build-arm64-jit-consumer --parallel 4
          LD_LIBRARY_PATH="$PWD/build-arm64-jit/install-sdk/lib" \
            ctest --test-dir build-arm64-jit-consumer --output-on-failure \
              -R "^installed_c_api_runtime$"
          cmake -S tests/installed_cpp_consumer -B build-arm64-jit-cpp-consumer -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/toolchains/linux-aarch64.cmake" \
            -DCMAKE_CROSSCOMPILING_EMULATOR="qemu-aarch64;-L;/usr/aarch64-linux-gnu" \
            -DCMAKE_PREFIX_PATH="$PWD/build-arm64-jit/install-sdk" \
            -DMPARSER_REQUIRED_VERSION=1.2.0
          cmake --build build-arm64-jit-cpp-consumer --parallel 4
          LD_LIBRARY_PATH="$PWD/build-arm64-jit/install-sdk/lib" \
            ctest --test-dir build-arm64-jit-cpp-consumer --output-on-failure \
              -R "^installed_cpp_api_runtime$"
          qemu-aarch64 -L /usr/aarch64-linux-gnu \
            ./build-arm64-jit/install-sdk/bin/mparser --version | tee build-arm64-jit/arm64-jit-sdk-version.txt
          grep --fixed-strings "MParser 1.2.0" build-arm64-jit/arm64-jit-sdk-version.txt
      - name: Validate unpacked AArch64 release archive under QEMU
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$PWD/build-arm64-jit/packages"
          package_name="mparser-1.2.0-linux-aarch64"
          archive="$package_dir/$package_name.tar.gz"
          (cd "$package_dir" && sha256sum --check "$package_name.tar.gz.sha256")
          unpack_root="$RUNNER_TEMP/mparser-arm64-release"
          rm -rf "$unpack_root"
          mkdir -p "$unpack_root"
          tar -xzf "$archive" -C "$unpack_root"
          sdk="$unpack_root/$package_name"
          test -f "$sdk/include/mparser/c_api.h"
          test -f "$sdk/include/mparser/cpp_api.hpp"
          test -f "$sdk/share/doc/MParser/LICENSE"
          test -f "$sdk/share/doc/MParser/NOTICE"
          test -f "$sdk/share/doc/MParser/THIRD_PARTY_NOTICES.md"
          test -f "$sdk/share/doc/MParser/public-contract-v1.json"
          test -f "$sdk/share/doc/MParser/machine-result-v1.schema.json"
          LD_LIBRARY_PATH="$sdk/lib" qemu-aarch64 -L /usr/aarch64-linux-gnu \
            "$sdk/bin/mparser" --run --jit=off --result-format=json-v1 \
            "$sdk/share/mparser/examples/machine_protocol_demo.m" \
            > "$RUNNER_TEMP/mparser-arm64-result.json"
          test "$(tail -c 1 "$RUNNER_TEMP/mparser-arm64-result.json" |
            od -An -t x1 | tr -d ' \n')" = "0a"
          ! LC_ALL=C grep -q $'\r' "$RUNNER_TEMP/mparser-arm64-result.json"
          grep --fixed-strings \
            '"protocol":{"name":"mparser.result","major":1,"minor":1}' \
            "$RUNNER_TEMP/mparser-arm64-result.json"
      - name: Upload Linux AArch64 release archive
        if: env.MPARSER_CI_RELEASE_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mparser-1.2.0-linux-aarch64
          path: |
            build-arm64-jit/packages/mparser-1.2.0-linux-aarch64.tar.gz
            build-arm64-jit/packages/mparser-1.2.0-linux-aarch64.tar.gz.sha256
            build-arm64-jit/packages/mparser-1.2.0-linux-aarch64.tar.gz.provenance.json
            build-arm64-jit/packages/SHA256SUMS
          if-no-files-found: error

  release-authentication:
    name: Release archives / Sigstore authentication candidate
    if: github.event_name == 'workflow_dispatch' && inputs.authenticate_release
    needs:
      - windows-x64
      - linux-x64
      - linux-arm64-native
      - linux-sanitizers
      - macos
      - linux-aarch64
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Require the exact release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "Release authentication requires a v* tag ref" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "v1.2.0" ]]; then
            echo "Release tag must equal project version v1.2.0" >&2
            exit 1
          fi
      - name: Download same-run release archives
        uses: actions/download-artifact@v5
        with:
          pattern: mparser-1.2.0-*
          path: release-authentication
      - name: Validate authentication inputs
        shell: bash
        run: |
          set -euo pipefail
          archive_list="$RUNNER_TEMP/mparser-release-archives.txt"
          : > "$archive_list"
          expected_archives=(
            mparser-1.2.0-windows-x86_64.zip
            mparser-1.2.0-linux-x86_64.tar.gz
            mparser-1.2.0-linux-aarch64.tar.gz
            mparser-1.2.0-macos-x86_64.tar.gz
            mparser-1.2.0-macos-arm64.tar.gz
          )
          for archive_name in "${expected_archives[@]}"; do
            mapfile -t matches < <(
              find release-authentication -type f -name "$archive_name" -print
            )
            if [[ "${#matches[@]}" -ne 1 ]]; then
              echo "Expected one $archive_name; found ${#matches[@]}" >&2
              exit 1
            fi
            archive="${matches[0]}"
            cmake \
              "-DMPARSER_ARCHIVE=$archive" \
              "-DMPARSER_PROVENANCE=$archive.provenance.json" \
              "-DMPARSER_CHECKSUM=$archive.sha256" \
              "-DMPARSER_CHECKSUMS=$(dirname "$archive")/SHA256SUMS" \
              "-DMPARSER_PROJECT_ROOT=$PWD" \
              "-DMPARSER_EXPECTED_REVISION=$GITHUB_SHA" \
              "-DMPARSER_SOURCE_REPOSITORY=https://github.com/$GITHUB_REPOSITORY" \
              -DMPARSER_PROJECT_VERSION=1.2.0 \
              -DMPARSER_EXPECTED_CONFIGURATION=Release \
              -DMPARSER_EXPECTED_NATIVE_JIT=ON \
              -DMPARSER_REQUIRE_CLEAN_SOURCE=ON \
              -DMPARSER_REQUIRE_EXACT_PACKAGE_SET=ON \
              -P tests/validate_release_authentication_input.cmake
            printf '%s\n' "$archive" >> "$archive_list"
          done
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign and verify release archives and local provenance
        shell: bash
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@${GITHUB_REF}"
          issuer="https://token.actions.githubusercontent.com"
          while IFS= read -r archive; do
            for subject in "$archive" "$archive.provenance.json"; do
              bundle="$subject.sigstore.json"
              cosign sign-blob "$subject" --bundle "$bundle" --yes
              cosign verify-blob "$subject" \
                --bundle "$bundle" \
                --certificate-identity "$identity" \
                --certificate-oidc-issuer "$issuer"
            done
          done < "$RUNNER_TEMP/mparser-release-archives.txt"
      - name: Upload authenticated release set
        uses: actions/upload-artifact@v7
        with:
          name: mparser-1.2.0-authenticated-${{ github.ref_name }}
          path: release-authentication
          if-no-files-found: error
          retention-days: 90
